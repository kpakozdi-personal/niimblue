name: Cleanup preview

on:
  pull_request:
    types: [closed]
  delete:

jobs:
  delete:
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main')
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BRANCH: ${{ github.head_ref || github.event.ref }}
    concurrency:
      group: cleanup-${{ github.head_ref || github.event.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      # PR close and branch delete both fire on merge+auto-delete; the second run finds nothing to delete
      - run: npx wrangler preview delete --name "$BRANCH" -y
        continue-on-error: true
